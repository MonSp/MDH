appId: com.mdh.desktop
productName: MDH
copyright: Copyright © 2026 MDH Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,ts,map}"
  - "!**/.git/**"

extraResources:
  - from: "public/"
    to: "public/"
    filter: ["**/*"]

asar: true

# ─── Windows ───
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/favicon.svg
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MDH - 大荒界"

# ─── macOS ───
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: public/favicon.svg
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Linux ───
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: public/favicon.svg
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: Development
  synopsis: "Multi-Agent Collaboration Desktop App"
  description: "MDH - 大荒界：多智能体协作桌面应用，一键创建本地智能体团队"

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

# ─── 自动更新 ───
publish:
  provider: github
  owner: mdh-team
  repo: mdh-desktop
  releaseType: release

# ─── 性能优化 ───
compression: maximum
removePackageScripts: true
