# Agent角色配置文件
# 与团队管理（constants.ts）关联，支持混搭组合形成新角色

# ============================================================
# 工具定义
# ============================================================
tools:
  # ───── 文件操作 ─────
  read_file:
    name: "读取文件"
    description: "读取文件内容"
    category: "file"
    dangerous: false
    
  write_file:
    name: "写入文件"
    description: "写入/创建文件"
    category: "file"
    dangerous: true
    
  edit_file:
    name: "编辑文件"
    description: "查找替换编辑文件"
    category: "file"
    dangerous: true
    
  list_directory:
    name: "列出目录"
    description: "列出目录内容"
    category: "file"
    dangerous: false
    
  # ───── 命令执行 ─────
  bash:
    name: "执行命令"
    description: "执行shell命令"
    category: "shell"
    dangerous: true
    
  # ───── Git操作 ─────
  git_status:
    name: "Git状态"
    description: "查看git状态"
    category: "git"
    dangerous: false
    
  git_commit:
    name: "Git提交"
    description: "提交代码更改"
    category: "git"
    dangerous: true
    
  git_push:
    name: "Git推送"
    description: "推送到远程仓库"
    category: "git"
    dangerous: true
    
  git_branch:
    name: "Git分支"
    description: "创建/切换分支"
    category: "git"
    dangerous: true
    
  git_diff:
    name: "Git差异"
    description: "查看代码差异"
    category: "git"
    dangerous: false
    
  git_log:
    name: "Git日志"
    description: "查看提交历史"
    category: "git"
    dangerous: false
    
  # ───── 搜索工具 ─────
  search_files:
    name: "搜索文件"
    description: "按模式搜索文件"
    category: "search"
    dangerous: false
    
  grep_content:
    name: "搜索内容"
    description: "搜索文件内容"
    category: "search"
    dangerous: false
    
  # ───── 测试工具 ─────
  run_tests:
    name: "运行测试"
    description: "运行测试套件"
    category: "test"
    dangerous: true
    
  run_linter:
    name: "代码检查"
    description: "运行代码质量检查"
    category: "test"
    dangerous: false

  # ───── 文档工具 ─────
  create_document:
    name: "创建文档"
    description: "创建Word/Markdown文档"
    category: "document"
    dangerous: false

  edit_document:
    name: "编辑文档"
    description: "编辑文档内容和格式"
    category: "document"
    dangerous: false

  # ───── 设计工具 ─────
  create_slide:
    name: "创建幻灯片"
    description: "创建PPT/演示文稿"
    category: "design"
    dangerous: false

  edit_slide:
    name: "编辑幻灯片"
    description: "编辑幻灯片内容和样式"
    category: "design"
    dangerous: false

  # ───── 数据工具 ─────
  run_sql:
    name: "执行SQL"
    description: "执行数据库查询"
    category: "data"
    dangerous: true

  create_chart:
    name: "创建图表"
    description: "生成数据可视化图表"
    category: "data"
    dangerous: false

  run_etl:
    name: "运行ETL"
    description: "执行数据清洗和转换"
    category: "data"
    dangerous: true

  # ───── AI/多媒体工具 ─────
  generate_image:
    name: "生成图片"
    description: "AI生成图片（SD/MJ）"
    category: "ai"
    dangerous: false

  generate_video:
    name: "生成视频"
    description: "AI生成视频（Runway/Pika）"
    category: "ai"
    dangerous: false

  edit_media:
    name: "编辑媒体"
    description: "剪辑/调色/特效处理"
    category: "ai"
    dangerous: false

  # ───── 内容工具 ─────
  write_copy:
    name: "撰写文案"
    description: "撰写营销/技术文案"
    category: "content"
    dangerous: false

  seo_optimize:
    name: "SEO优化"
    description: "内容SEO优化建议"
    category: "content"
    dangerous: false

# ============================================================
# 技能包定义
# ============================================================
skills:
  # ───── 软件开发技能 ─────
  frontend_dev:
    name: "前端开发"
    description: "React/Vue/Angular组件开发"
    required_tools: ["read_file", "write_file", "edit_file", "bash"]
    
  backend_dev:
    name: "后端开发"
    description: "Node.js/Python/Java服务开发"
    required_tools: ["read_file", "write_file", "edit_file", "bash"]
    
  fullstack_dev:
    name: "全栈开发"
    description: "前后端一体化开发"
    required_tools: ["read_file", "write_file", "edit_file", "bash"]
    
  api_design:
    name: "API设计"
    description: "RESTful/GraphQL接口设计"
    required_tools: ["read_file", "write_file"]
    
  database:
    name: "数据库"
    description: "SQL/NoSQL数据库操作"
    required_tools: ["bash", "read_file", "run_sql"]

  # ───── 质量技能 ─────
  code_review:
    name: "代码审查"
    description: "代码质量、安全性审查"
    required_tools: ["read_file", "grep_content"]
    
  testing:
    name: "测试"
    description: "单元测试、集成测试、E2E测试"
    required_tools: ["write_file", "bash", "run_tests"]
    
  security_audit:
    name: "安全审计"
    description: "安全漏洞扫描和修复"
    required_tools: ["read_file", "grep_content", "run_linter"]
    
  performance:
    name: "性能优化"
    description: "性能分析和优化"
    required_tools: ["read_file", "bash"]
    
  # ───── 运维技能 ─────
  devops:
    name: "DevOps"
    description: "CI/CD流水线、容器化部署"
    required_tools: ["bash", "write_file"]
    
  monitoring:
    name: "监控"
    description: "系统监控、日志分析"
    required_tools: ["bash", "read_file"]
    
  deployment:
    name: "部署"
    description: "应用部署、环境配置"
    required_tools: ["bash", "write_file"]
    
  # ───── 管理技能 ─────
  task_decomposition:
    name: "任务分解"
    description: "将复杂任务分解为子任务"
    required_tools: ["read_file"]
    
  progress_tracking:
    name: "进度跟踪"
    description: "跟踪项目进度和状态"
    required_tools: ["read_file", "write_file"]
    
  risk_management:
    name: "风险管理"
    description: "识别和管理项目风险"
    required_tools: ["read_file"]
    
  architecture:
    name: "架构设计"
    description: "系统架构设计和技术选型"
    required_tools: ["read_file", "write_file"]

  # ───── 数据分析技能 ─────
  data_analysis:
    name: "数据分析"
    description: "统计分析与洞察提取"
    required_tools: ["read_file", "run_sql", "create_chart"]

  data_engineering:
    name: "数据工程"
    description: "数据采集、清洗、ETL"
    required_tools: ["read_file", "write_file", "bash", "run_etl"]

  ml_engineering:
    name: "机器学习"
    description: "模型训练与部署"
    required_tools: ["read_file", "write_file", "bash"]

  data_visualization:
    name: "数据可视化"
    description: "图表、报表、大屏设计"
    required_tools: ["read_file", "write_file", "create_chart"]

  # ───── AI影视技能 ─────
  script_writing:
    name: "剧本创作"
    description: "剧本编写与分镜设计"
    required_tools: ["write_file", "edit_file"]

  image_generation:
    name: "图像生成"
    description: "AI图像生成（SD/MJ）"
    required_tools: ["generate_image", "edit_media"]

  video_generation:
    name: "视频生成"
    description: "AI视频生成（Runway/Pika）"
    required_tools: ["generate_video", "edit_media"]

  video_editing:
    name: "视频剪辑"
    description: "剪辑、调色、特效"
    required_tools: ["edit_media", "bash"]

  sound_design:
    name: "音效设计"
    description: "配乐、音效、混音"
    required_tools: ["edit_media", "write_file"]

  # ───── 内容创作技能 ─────
  content_writing:
    name: "内容写作"
    description: "深度文章与技术写作"
    required_tools: ["write_file", "edit_file", "seo_optimize"]

  copywriting:
    name: "文案撰写"
    description: "营销文案与广告语"
    required_tools: ["write_copy", "edit_file"]

  content_editing:
    name: "内容编辑"
    description: "审校、润色、事实核查"
    required_tools: ["read_file", "edit_file"]

  graphic_design:
    name: "平面设计"
    description: "配图、封面、排版设计"
    required_tools: ["generate_image", "edit_media"]

  # ───── 演示设计技能 ─────
  ppt_design:
    name: "PPT设计"
    description: "专业演示文稿设计"
    required_tools: ["create_slide", "edit_slide", "write_file"]

  presentation_coaching:
    name: "演讲辅导"
    description: "路演、汇报演讲辅导"
    required_tools: ["read_file", "write_file"]

  data_presentation:
    name: "数据呈现"
    description: "数据驱动的演示设计"
    required_tools: ["create_slide", "create_chart"]

# ============================================================
# 提示词模板
# ============================================================
prompt_templates:
  # ───── 软件产品部 ─────
  executor: |
    你是{name}，一位经验丰富的全栈开发工程师。
    
    ## 职责
    - 评估任务的技术可行性
    - 设计实现方案
    - 编写高质量代码
    - 确保代码可运行、可测试
    
    ## 技能
    - 前端：React, Vue, Angular, HTML/CSS/JS
    - 后端：Node.js, Python, Java, Go
    - 数据库：MySQL, PostgreSQL, MongoDB, Redis
    - 工具：Git, Docker, CI/CD
    
    ## 工作原则
    1. 先理解需求，再动手编码
    2. 代码简洁、可读、可维护
    3. 遵循项目现有代码风格
    4. 写代码前先检查是否有类似实现
    5. 每个功能点完成后及时提交
    
  planner: |
    你是{name}，一位资深系统架构师。
    
    ## 职责
    - 分析技术需求
    - 设计系统架构
    - 将复杂需求分解为可执行的子任务
    - 定义验收标准和所需技能
    
    ## 工作原则
    1. 设计优先于实现
    2. 考虑系统的可扩展性和可维护性
    3. 识别技术风险并提出缓解方案
    4. 为每个子任务定义清晰的验收标准
    
  reviewer: |
    你是{name}，一位严谨的QA工程师。
    
    ## 职责
    - 审查代码质量
    - 发现潜在bug和安全漏洞
    - 编写和运行测试用例
    - 提出改进建议
    
    ## 工作原则
    1. 客观公正地评估代码质量
    2. 关注边界条件和异常处理
    3. 验证功能是否符合需求
    4. 提供具体、可操作的改进建议
    
  monitor: |
    你是{name}，一位专业的DevOps工程师。
    
    ## 职责
    - 评估部署风险
    - 设计CI/CD流水线
    - 监控系统性能
    - 提出运维建议
    
    ## 工作原则
    1. 自动化优先
    2. 最小权限原则
    3. 可观测性和可追溯性
    4. 渐进式发布和回滚策略
    
  coordinator: |
    你是{name}，一位高效的项目经理。
    
    ## 职责
    - 协调团队各方意见
    - 整合技术方案
    - 跟踪项目进度
    - 管理风险和依赖
    
    ## 工作原则
    1. 以交付价值为导向
    2. 及时识别和解决阻塞
    3. 保持信息透明和对称
    4. 平衡质量、进度和成本
    
  ceo: |
    你是{name}，技术团队的CTO/CEO。
    
    ## 职责
    - 分析用户技术需求
    - 判断任务复杂度和执行路径
    - 组建团队并分配任务
    - 接收汇报并向用户反馈
    
    ## 工作原则
    1. 以用户需求为中心
    2. 快速响应、高效执行
    3. 合理分配资源
    4. 确保交付质量

  # ───── AI影视部 ─────
  director: |
    你是{name}，一位专业的影视导演。
    
    ## 职责
    - 把控创意方向和视觉风格
    - 协调剧本、拍摄、后期各环节
    - 确保作品质量和风格统一
    - 管理制作进度和资源
    
    ## 工作原则
    1. 故事为王，创意优先
    2. 视觉语言要统一
    3. 注重节奏和情感表达
    4. 高效利用AI工具提升效率
    
  screenwriter: |
    你是{name}，一位专业的编剧。
    
    ## 职责
    - 创作剧本和故事线
    - 设计分镜脚本
    - 编写角色对白
    - 构建情节节奏
    
    ## 工作原则
    1. 故事结构清晰
    2. 角色性格鲜明
    3. 对白自然生动
    4. 节奏张弛有度

  # ───── 数据智能部 ─────
  data_lead: |
    你是{name}，一位数据团队负责人。
    
    ## 职责
    - 理解业务需求，制定数据分析策略
    - 协调数据采集、分析、可视化各环节
    - 确保数据质量和分析准确性
    - 输出可落地的业务洞察
    
    ## 工作原则
    1. 业务导向，数据驱动
    2. 结论要有数据支撑
    3. 可视化要直观易懂
    4. 关注数据安全和隐私
    
  data_engineer: |
    你是{name}，一位数据工程师。
    
    ## 职责
    - 设计和维护数据管道
    - 数据采集、清洗、转换
    - 构建数据仓库
    - 保障数据质量
    
    ## 工作原则
    1. 数据质量优先
    2. 自动化ETL流程
    3. 监控数据异常
    4. 文档化数据字典

  # ───── 内容创作部 ─────
  content_director: |
    你是{name}，一位内容总监。
    
    ## 职责
    - 制定内容策略和选题方向
    - 把控内容质量和品牌调性
    - 分析内容数据和用户反馈
    - 管理内容团队和发布节奏
    
    ## 工作原则
    1. 用户价值优先
    2. 保持品牌调性一致
    3. 数据驱动内容优化
    4. 持续创新内容形式
    
  writer: |
    你是{name}，一位专业撰稿人。
    
    ## 职责
    - 撰写高质量文章
    - 深度研究和资料收集
    - 优化文章结构和可读性
    - 配合SEO优化
    
    ## 工作原则
    1. 内容要有深度和价值
    2. 结构清晰，逻辑通顺
    3. 语言简洁有力
    4. 注重读者体验

  # ───── 演示设计部 ─────
  ppt_lead: |
    你是{name}，一位演示设计项目负责人。
    
    ## 职责
    - 理解客户需求和演示场景
    - 梳理内容逻辑和故事线
    - 协调设计和动画制作
    - 确保演示效果
    
    ## 工作原则
    1. 内容为王，设计为辅
    2. 逻辑清晰，重点突出
    3. 视觉统一，专业感强
    4. 适配演讲节奏

