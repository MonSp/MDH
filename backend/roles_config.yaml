skills:
  api_design:
    category: dev
    description: RESTful/GraphQL接口设计，版本控制，文档生成
    methodology: 契约优先设计（Contract-First）— 先定义接口规范，前后端并行开发
    name: API设计
    practices:
    - RESTful资源命名：名词复数、HTTP方法语义化（GET/POST/PUT/DELETE）
    - 统一响应格式：{ code, message, data }，错误码分类管理
    - 分页、过滤、排序用查询参数：?page=1&limit=20&sort=-created_at
    - API版本控制：URL路径（/v1/）或Accept Header
    - 敏感操作用POST/PUT，禁止GET修改数据
    - 幂等性：PUT/DELETE多次调用结果相同
    required_tools:
    - read_file
    - write_file
    workflow:
      1: 识别资源和操作（CRUD + 自定义动作）
      2: 设计URL结构和HTTP方法
      3: 定义请求/响应Schema（JSON Schema或TypeScript类型）
      4: 编写OpenAPI规范文档
      5: 实现并编写契约测试
  architecture:
    category: dev
    description: 系统架构设计，技术选型，可扩展性规划，架构评审
    methodology: 架构决策记录（ADR）— 每个重要决策记录背景、选项、决策和后果
    name: 架构设计
    practices:
    - 架构原则：简单优先、为变化设计、演进式架构
    - 技术选型：成熟度/社区/维护成本/团队熟悉度综合评估
    - 可扩展性：水平扩展优于垂直扩展，无状态服务
    - 解耦策略：消息队列/事件驱动/API Gateway
    - 数据一致性：强一致vs最终一致，根据业务场景选择
    - 架构评审：重大变更必须经过架构评审会议
    required_tools:
    - read_file
    - write_file
    workflow:
      1: 理解业务需求和约束条件
      2: 识别架构关键需求（性能/可用性/扩展性/安全）
      3: 设计候选架构方案（至少2-3个）
      4: 评估方案优缺点，做出决策
      5: 编写ADR文档
      6: 架构评审和迭代
  backend_dev:
    category: dev
    description: API设计，数据库操作，服务端逻辑，错误处理
    methodology: 领域驱动设计（DDD）— 以业务领域为核心设计服务边界和数据模型
    name: 后端开发
    practices:
    - API优先设计：先写OpenAPI/AsyncAPI规范，再实现
    - 错误处理分层：业务异常（4xx）vs 系统异常（5xx），统一错误格式
    - 输入验证在边界层完成，内部函数信任已验证数据
    - 数据库操作使用参数化查询，禁止字符串拼接SQL
    - 日志分级：DEBUG开发调试、INFO业务流程、WARN可恢复异常、ERROR需人工介入
    - 配置与代码分离，敏感信息用环境变量
    required_tools:
    - read_file
    - write_file
    - edit_file
    - bash
    workflow:
      1: 理解业务需求，识别核心领域模型
      2: 设计API接口和数据Schema
      3: 实现核心业务逻辑（先写测试）
      4: 添加数据持久化层
      5: 实现错误处理和日志
      6: 编写集成测试和API文档
  brand_identity:
    category: design
    description: Logo设计，色彩系统，字体规范，视觉识别系统
    methodology: 视觉识别系统（VIS）— 从Logo到应用的完整视觉规范
    name: 品牌视觉
    practices:
    - Logo设计：简洁/可识别/可缩放/单色可用
    - 色彩系统：主色+辅助色+中性色，明暗模式适配
    - 字体规范：标题/正文字体，字号/行高/字重系统
    - 网格系统：8px基准网格，对齐和间距规范
    - 图标风格：线性/填充/双色，统一描边粗细
    - 品牌应用：名片/网站/APP/包装的视觉规范
    required_tools:
    - generate_image
    - write_file
    workflow:
      1: 理解品牌策略和定位
      2: 探索视觉方向（Moodboard）
      3: 设计Logo和标识系统
      4: 定义色彩和字体系统
      5: 创建视觉组件库
      6: 编写品牌视觉指南
  brand_strategy:
    category: design
    description: 品牌定位，价值主张，品牌架构，品牌资产管理
    methodology: 品牌金字塔 — 功能利益→情感利益→自我表达利益→品牌精髓
    name: 品牌策略
    practices:
    - 品牌定位：目标受众+品类+差异化价值+信任状
    - 价值主张画布：用户痛点/收益 ↔ 产品功能/收益缓解
    - 品牌架构：主品牌/子品牌/背书品牌的关系设计
    - 品牌故事：起源/使命/愿景/价值观的叙事
    - 品牌声音：人设/语调/用词风格的一致性
    - 品牌触点管理：所有用户接触点的品牌体验
    required_tools:
    - write_file
    - create_document
    workflow:
      1: 市场和竞品分析
      2: 目标受众洞察
      3: 品牌定位和价值主张
      4: 品牌个性和声音定义
      5: 品牌架构设计
      6: 品牌指南编写
  brand_voice:
    category: design
    description: 语调规范，文案风格，消息架构，内容指南
    methodology: 品牌声音四维度 — 个性/语调/用词/节奏
    name: 品牌声音
    practices:
    - 品牌人设：如果品牌是一个人，TA的性格是什么
    - 语调光谱：正式↔随意、严肃↔幽默、专业↔亲切
    - 用词规范：推荐用词/避免用词/行业术语使用规则
    - 消息层次：品牌标语→价值主张→功能描述→行动号召
    - 内容模板：常见场景的文案模板（社交媒体/邮件/错误提示）
    - 一致性检查：定期审查各渠道内容的品牌声音一致性
    required_tools:
    - write_file
    - write_copy
    workflow:
      1: 定义品牌个性和价值观
      2: 设计品牌声音维度
      3: 创建用词和语调指南
      4: 编写内容模板和示例
      5: 培训团队使用品牌声音
      6: 定期审查和优化
  code_review:
    category: testing
    description: 代码质量审查，安全漏洞发现，最佳实践检查
    methodology: 导师式审查 — 不只是找bug，而是帮助团队成员成长
    name: 代码审查
    practices:
    - 先理解意图：阅读PR描述和关联Issue，理解为什么改
    - 分层审查：正确性→安全性→可维护性→性能→风格
    - 具体明确：指出文件名:行号，说明问题和建议方案
    - 分级标记：🔴必须修（阻塞）、🟡建议改（不阻塞）、💭讨论（开放）
    - 安全检查：输入验证、权限控制、SQL注入、XSS、敏感信息泄露
    - 好的代码也要表扬，正向反馈促进团队文化
    required_tools:
    - read_file
    - grep_content
    workflow:
      1: 阅读PR描述和关联Issue，理解变更目的
      2: 检查代码变更的整体设计是否合理
      3: 逐文件审查，标记问题和建议
      4: 运行测试确认不破坏现有功能
      5: 编写审查总结（整体印象+关键问题+亮点）
  competitive_analysis:
    category: sales
    description: 竞品研究，差异化定位，战斗卡，SWOT分析
    methodology: 竞争情报系统 — 持续收集/分析/应用竞争情报
    name: 竞争分析
    practices:
    - 竞品分类：直接竞品/间接竞品/替代品/潜在进入者
    - SWOT分析：优势/劣势/机会/威胁的系统化评估
    - 差异化定位：找到竞品无法复制的独特价值
    - 战斗卡：针对每个主要竞品的销售话术和应对策略
    - 竞品监控：定期收集竞品动态（产品更新/价格变化/市场活动）
    - Win/Loss分析：赢单/输单中竞品因素的分析
    required_tools:
    - read_file
    - write_file
    - search_files
    workflow:
      1: 识别主要竞品（3-5个）
      2: 收集竞品信息（产品/价格/市场/客户）
      3: 进行SWOT分析
      4: 制定差异化策略
      5: 创建战斗卡
      6: 定期更新竞争情报
  content_editing:
    category: content
    description: 审校润色，事实核查，风格统一，质量把控
    methodology: 四轮编辑法 — 结构编辑→内容编辑→文字编辑→校对
    name: 内容编辑
    practices:
    - 结构编辑：逻辑是否清晰，段落顺序是否合理
    - 内容编辑：信息是否准确，论据是否充分
    - 文字编辑：语言是否简洁，是否有冗余表达
    - 校对：错别字/标点/格式/一致性
    - 事实核查：数据/引用/专业术语的准确性
    - 风格指南：遵循品牌内容风格指南
    required_tools:
    - read_file
    - edit_file
    workflow:
      1: 通读全文，理解主旨
      2: 检查结构和逻辑
      3: 审核内容准确性
      4: 润色语言表达
      5: 校对细节
      6: 输出编辑建议
  content_writing:
    category: content
    description: 深度文章，技术文档，SEO优化，内容策略
    methodology: 倒金字塔写作 — 结论先行，重要信息前置
    name: 内容写作
    practices:
    - 标题优化：数字+痛点+解决方案，60字符内
    - 结构化写作：H2/H3分层，段落不超过4行，关键信息加粗
    - SEO优化：关键词研究→标题/描述/正文自然融入→内链外链
    - 可读性：短句为主，避免被动语态，Flesch阅读分数60+
    - 引用和数据：观点有数据支撑，数据注明来源
    - CTA设计：每篇文章有明确的下一步行动
    required_tools:
    - write_file
    - edit_file
    - seo_optimize
    workflow:
      1: 确定主题和目标关键词
      2: 研究竞品内容和用户搜索意图
      3: 创建内容大纲
      4: 撰写初稿
      5: SEO优化和编辑润色
      6: 发布和效果跟踪
  copywriting:
    category: content
    description: 营销文案，广告语，社交媒体文案，转化优化
    methodology: AIDA模型 — Attention（注意）→ Interest（兴趣）→ Desire（欲望）→ Action（行动）
    name: 文案撰写
    practices:
    - 痛点切入：从用户痛点开始，而非产品功能
    - 利益导向：说用户能得到什么，而非产品有什么
    - 社会证明：客户评价/数据/案例增加可信度
    - 紧迫感：限时/限量/限价，推动立即行动
    - A/B测试：不同版本文案测试转化率
    - 品牌一致性：所有文案符合品牌声音
    required_tools:
    - write_copy
    - edit_file
    workflow:
      1: 了解目标受众和痛点
      2: 确定文案目标和渠道
      3: 撰写多个版本
      4: 内部评审和优化
      5: A/B测试
      6: 效果分析和迭代
  data_analysis:
    category: data
    description: 统计分析，假设检验，A/B测试，业务洞察提取
    methodology: CRISP-DM — 业务理解→数据理解→数据准备→建模→评估→部署
    name: 数据分析
    practices:
    - 数据质量先行：缺失值/异常值/重复值处理后再分析
    - 探索性分析（EDA）：分布/相关性/趋势/异常，先画图再建模
    - 统计显著性：p值 < 0.05，置信区间，效应量
    - A/B测试：样本量计算、随机分组、多重比较校正
    - 指标定义：北极星指标+辅助指标，避免虚荣指标
    - 可复现性：分析脚本版本化，数据来源可追溯
    required_tools:
    - read_file
    - run_sql
    - create_chart
    workflow:
      1: 明确业务问题和分析目标
      2: 数据采集和质量检查
      3: 探索性数据分析（EDA）
      4: 假设检验/建模分析
      5: 提取洞察和建议
      6: 可视化呈现和报告
  data_engineering:
    category: data
    description: 数据管道设计，ETL/ELT，数据质量保障，数据治理
    methodology: 数据质量六维度 — 完整性/准确性/一致性/及时性/唯一性/有效性
    name: 数据工程
    practices:
    - ETL vs ELT选择：小数据量ETL，大数据量ELT（先加载后转换）
    - 数据管道幂等性：重跑不会产生重复数据
    - 增量处理：优先增量同步而非全量，减少资源消耗
    - 数据验证：每个阶段都有数据质量检查
    - Schema管理：版本化Schema，向后兼容变更
    - 数据血缘：追踪数据从源头到消费的完整链路
    required_tools:
    - read_file
    - write_file
    - bash
    - run_etl
    workflow:
      1: 理解数据源和目标数据模型
      2: 设计数据管道架构（批处理/流处理）
      3: 实现数据采集和转换逻辑
      4: 添加数据质量检查
      5: 配置调度和监控
      6: 编写数据字典和文档
  data_presentation:
    category: data
    description: 数据故事化，图表设计，仪表盘布局，洞察可视化
    methodology: 数据故事三要素 — 数据+视觉+叙事
    name: 数据呈现
    practices:
    - 数据故事线：背景→冲突→解决方案→证据→结论
    - 图表选择：比较用柱状图、趋势用折线图、占比用饼图
    - 高亮关键数据：用颜色/大小/位置突出核心指标
    - 简化图表：去除多余元素（网格线/边框/3D效果）
    - 对比基准：添加行业基准/历史数据/目标值作为对比
    - 交互设计：支持下钻、筛选、时间范围选择
    required_tools:
    - create_slide
    - create_chart
    workflow:
      1: 明确数据呈现目标
      2: 分析数据，提取关键洞察
      3: 设计数据故事线
      4: 选择合适的图表类型
      5: 设计可视化布局
      6: 添加交互和动画
  data_visualization:
    category: data
    description: 图表设计，仪表盘构建，数据故事讲述
    methodology: 数据墨水比 — 最大化数据墨水比，减少非数据元素
    name: 数据可视化
    practices:
    - 图表选择：趋势用折线图、比较用柱状图、占比用饼图、分布用直方图
    - 色彩使用：分类色板不超过7种，连续色板用单色渐变
    - 标注关键数据点，添加趋势线和参考线
    - 交互设计：筛选/下钻/联动，支持用户自主探索
    - 响应式设计：适配桌面和移动端
    - 性能优化：大数据集使用采样或聚合
    required_tools:
    - read_file
    - write_file
    - create_chart
    workflow:
      1: 理解数据和受众（管理层/分析师/业务人员）
      2: 选择合适的图表类型
      3: 设计布局和交互方式
      4: 实现可视化组件
      5: 添加交互和动画
      6: 性能优化和响应式适配
  database:
    category: dev
    description: Schema设计，查询优化，数据迁移，索引策略
    methodology: 数据建模三范式 + 适度反范式 — 先规范化保证一致性，再按查询需求反范式化
    name: 数据库
    practices:
    - 主键选择：自增ID（简单）、UUID（分布式）、雪花ID（有序分布式）
    - 索引策略：WHERE/JOIN/ORDER BY字段建索引，避免过度索引影响写入
    - 查询优化：EXPLAIN分析执行计划，避免全表扫描和文件排序
    - 迁移脚本必须可回滚：UP和DOWN成对编写
    - 软删除（deleted_at）vs 硬删除：业务数据用软删除
    - 大表变更：分批执行、在线DDL、添加字段默认值
    required_tools:
    - bash
    - read_file
    - run_sql
    workflow:
      1: 分析业务实体和关系（ER图）
      2: 设计表结构和字段类型
      3: 定义索引和约束
      4: 编写迁移脚本（含回滚）
      5: 编写种子数据和测试数据
      6: 性能测试和查询优化
  deployment:
    category: ops
    description: 发布策略，环境配置，回滚方案，灰度发布
    methodology: 渐进式发布 — 从少量用户开始，逐步扩大发布范围
    name: 部署
    practices:
    - 蓝绿部署：两套环境切换，零停机时间
    - 金丝雀发布：先发布到1-5%用户，观察指标后再全量
    - 功能开关（Feature Flag）：代码部署与功能发布解耦
    - 数据库迁移与应用部署分离：先迁移数据库，再部署应用
    - 健康检查：启动检查（liveness）+ 就绪检查（readiness）
    - 部署清单：预检查→部署→验证→监控→完成/回滚
    required_tools:
    - bash
    - write_file
    workflow:
      1: 确认发布内容和版本号
      2: 执行预部署检查（测试通过/依赖就绪/数据库迁移）
      3: 部署到预发布环境验证
      4: 灰度发布到生产环境
      5: 监控关键指标（错误率/延迟/资源）
      6: 全量发布或回滚
  devops:
    category: ops
    description: CI/CD流水线，基础设施即代码，容器化部署
    methodology: 基础设施即代码（IaC）— 所有基础设施变更通过代码和版本控制管理
    name: DevOps
    practices:
    - CI/CD流水线：代码提交→自动测试→构建→部署，全程自动化
    - 容器化：Dockerfile多阶段构建，镜像最小化，非root用户运行
    - 环境一致性：开发/测试/生产环境配置通过环境变量区分
    - 版本控制：语义化版本（SemVer），Git标签触发发布
    - 回滚策略：每次部署保留前一版本，支持快速回滚
    - 密钥管理：使用Vault/Secrets Manager，禁止代码中硬编码
    required_tools:
    - bash
    - write_file
    workflow:
      1: 定义基础设施需求（服务器/数据库/网络/存储）
      2: 编写IaC配置（Terraform/CloudFormation/CDK）
      3: 配置CI/CD流水线（构建/测试/部署阶段）
      4: 设置监控和告警
      5: 编写运维文档和故障处理手册
      6: 定期演练故障恢复流程
  frontend_dev:
    category: dev
    description: 组件驱动开发，状态管理，响应式设计，性能优化
    methodology: 组件驱动开发（CDD）— 先写组件接口和Props定义，再实现内部逻辑
    name: 前端开发
    practices:
    - 组件职责单一：一个组件只做一件事，超过300行考虑拆分
    - 状态提升到最近共同祖先，避免prop drilling用Context/Zustand
    - TypeScript全面覆盖：Props/State/Event全部显式类型
    - 列表渲染必须提供稳定key，禁止使用index作为key
    - useEffect清理函数必须处理，避免内存泄漏和状态更新
    - 图片/路由/重型组件使用懒加载（React.lazy / dynamic import）
    required_tools:
    - read_file
    - write_file
    - edit_file
    - bash
    workflow:
      1: 分析需求，识别组件边界和数据流方向
      2: 定义组件接口（Props/Events/Slots）
      3: 实现组件骨架，先写静态版本
      4: 添加状态管理和交互逻辑
      5: 处理边界条件和错误状态
      6: 优化性能（memo/useMemo/useCallback按需使用）
  fullstack_dev:
    category: dev
    description: 前后端一体化开发，全链路问题排查
    methodology: 垂直切片开发 — 每个功能从UI到数据库完整实现，而非按层开发
    name: 全栈开发
    practices:
    - 前后端接口契约先行，使用TypeScript类型共享或OpenAPI
    - 前后端错误统一处理：前端toast/页面、后端错误码+消息
    - 开发时先跑通最小闭环，再逐步完善
    - 关注端到端数据流：用户操作→前端状态→API→数据库→响应→UI更新
    required_tools:
    - read_file
    - write_file
    - edit_file
    - bash
    workflow:
      1: 定义功能的完整数据流（前端→后端→数据库）
      2: 前后端同时开发，用mock数据串联
      3: 联调时关注边界条件和错误路径
      4: 端到端测试覆盖核心路径
  graphic_design:
    category: design
    description: 配图设计，封面设计，排版布局，视觉传达
    methodology: 视觉层次理论 — 通过大小/颜色/对比/位置引导视线
    name: 平面设计
    practices:
    - 视觉层次：主标题>副标题>正文>注释，大小/粗细/颜色递减
    - 对齐原则：使用网格系统，元素对齐到基线网格
    - 留白设计：适当留白增加可读性和高级感
    - 色彩搭配：60-30-10法则（主色60%/辅色30%/强调色10%）
    - 字体搭配：标题用展示字体，正文用易读字体，不超过3种
    - 响应式设计：适配不同尺寸和媒介
    required_tools:
    - generate_image
    - edit_media
    workflow:
      1: 理解设计需求和目标
      2: 收集参考资料和灵感
      3: 设计多个方案
      4: 选定方案并细化
      5: 输出设计稿
      6: 根据反馈修改
  image_generation:
    category: ai
    description: AI图像生成，提示词工程，风格控制，图像编辑
    methodology: 提示词工程 — 主体+风格+构图+光照+质量词，迭代优化
    name: 图像生成
    practices:
    - 提示词结构：主体描述→艺术风格→构图→光照→质量修饰词
    - 负面提示词：排除不想要的元素（模糊/变形/低质量）
    - 种子控制：固定种子实现风格一致性
    - 分辨率和宽高比：根据用途选择（16:9视频/1:1头像/9:16手机）
    - 后期处理：超分辨率/修复/局部重绘
    - 版权合规：确认AI生成内容的商用许可
    required_tools:
    - generate_image
    - edit_media
    workflow:
      1: 确定图像用途和风格要求
      2: 编写初始提示词
      3: 生成多张候选图
      4: 筛选和迭代优化
      5: 后期处理和精修
      6: 输出最终版本
  incident_response:
    category: ops
    description: 故障排查，根因分析，事后复盘，改进措施
    methodology: 无指责事后复盘 — 关注系统改进而非个人责任
    name: 故障响应
    practices:
    - 故障分级：P0（全面不可用）→ P1（核心功能受损）→ P2（部分降级）→ P3（轻微影响）
    - 响应流程：确认→评估→沟通→定位→修复→验证→复盘
    - 沟通原则：定期更新状态（每15-30分钟），指定单一沟通窗口
    - 根因分析：5个Why追问法，找到系统性原因而非表面现象
    - 改进措施：每个改进项有负责人和截止日期
    - 故障文档：时间线、影响范围、根因、修复措施、改进项
    required_tools:
    - bash
    - read_file
    - grep_content
    workflow:
      1: 确认故障现象和影响范围
      2: 评估故障等级，启动相应响应流程
      3: 快速定位根因（监控→日志→链路→代码）
      4: 实施修复（热修复/回滚/降级）
      5: 验证修复效果，确认服务恢复
      6: 48小时内完成事后复盘
  ml_engineering:
    category: data
    description: 模型训练，特征工程，模型评估，MLOps部署
    methodology: MLOps生命周期 — 数据→训练→评估→部署→监控→迭代
    name: 机器学习
    practices:
    - 特征工程：特征选择/构造/编码/缩放，避免数据泄漏
    - 模型评估：交叉验证、多指标评估（准确率/召回率/F1/AUC）
    - 过拟合预防：正则化/Dropout/早停/数据增强
    - 模型版本化：MLflow/W&B跟踪实验，模型注册表管理版本
    - 在线监控：数据漂移检测、模型性能衰减告警
    - A/B测试上线：新模型灰度发布，对比旧模型效果
    required_tools:
    - read_file
    - write_file
    - bash
    workflow:
      1: 定义问题和评估指标
      2: 数据收集和探索性分析
      3: 特征工程和数据预处理
      4: 模型选择和训练
      5: 模型评估和调优
      6: 模型部署和监控
  monitoring:
    category: ops
    description: 系统监控，日志分析，告警配置，故障排查
    methodology: 可观测性三支柱 — Metrics（指标）+ Logs（日志）+ Traces（链路追踪）
    name: 监控
    practices:
    - 关键指标必须监控：请求量、错误率、延迟（P50/P95/P99）、资源使用率
    - 日志结构化：JSON格式，包含trace_id/request_id/user_id
    - 告警分级：P0（立即响应）→ P1（1小时内）→ P2（工作时间）→ P3（下次迭代）
    - 告警去重和聚合，避免告警风暴
    - 仪表盘设计：概览→下钻→详情，5秒内看清系统状态
    - 故障排查路径：监控发现→日志定位→链路追踪→代码分析
    required_tools:
    - bash
    - read_file
    workflow:
      1: 识别关键业务指标和技术指标
      2: 配置指标采集（Prometheus/DataDog/CloudWatch）
      3: 配置日志收集和分析（ELK/Loki）
      4: 设置告警规则和通知渠道
      5: 创建监控仪表盘
      6: 编写故障排查手册
  performance:
    category: testing
    description: 性能分析，瓶颈定位，优化策略，负载测试
    methodology: 测量驱动优化 — 先量化瓶颈，再针对性优化，避免过早优化
    name: 性能优化
    practices:
    - 性能预算：FCP < 1.5s, LCP < 2.5s, CLS < 0.1, TTI < 3.5s
    - 前端优化：代码分割、懒加载、图片优化（WebP/AVIF）、CDN加速
    - 后端优化：N+1查询消除、缓存策略（Redis/CDN）、异步处理
    - 数据库优化：索引优化、查询计划分析、连接池配置
    - 内存优化：避免内存泄漏、大数据集流式处理、GC调优
    - 并发优化：连接池、线程池、异步IO、负载均衡
    required_tools:
    - read_file
    - bash
    workflow:
      1: 建立性能基线（当前指标）
      2: 使用Profiler定位瓶颈（CPU/内存/IO/网络）
      3: 针对瓶颈制定优化方案
      4: 实施优化并测量效果
      5: 回归测试确保功能正确
      6: 持续监控防止性能退化
  persona_development:
    category: ux
    description: 用户画像创建，用户旅程地图，同理心地图
    methodology: 数据驱动画像 — 基于真实用户数据而非假设创建画像
    name: 用户画像
    practices:
    - 画像数量：3-5个主要画像，覆盖80%用户群体
    - 画像要素：基本信息/目标/痛点/行为模式/使用场景
    - 旅程地图：阶段→行为→想法→情绪→痛点→机会
    - 同理心地图：说/想/做/感受，理解用户内心世界
    - 画像命名和照片：增加真实感和代入感
    - 定期更新：基于新数据迭代画像
    required_tools:
    - write_file
    - create_document
    workflow:
      1: 收集用户数据（访谈/问卷/行为数据）
      2: 识别用户群体和细分
      3: 创建用户画像档案
      4: 绘制用户旅程地图
      5: 识别设计机会点
      6: 与团队分享并应用到设计
  ppt_design:
    category: design
    description: 演示文稿设计，信息架构，视觉叙事，动画设计
    methodology: 故事弧线设计 — 开场钩子→问题呈现→方案展示→价值证明→行动号召
    name: PPT设计
    practices:
    - 一页一观点：每页PPT只传达一个核心信息
    - 10-20-30法则：10页/20分钟/30号字体
    - 数据可视化：用图表替代表格，突出关键数据点
    - 动画原则：动画服务于内容，避免花哨过渡
    - 配色一致：整套PPT使用统一的配色方案
    - 字体可读性：投影场景字号不小于24pt
    required_tools:
    - create_slide
    - edit_slide
    - write_file
    workflow:
      1: 理解演示场景和受众
      2: 设计故事线和内容结构
      3: 创建页面布局模板
      4: 设计各页面内容
      5: 添加动画和转场
      6: 排练和优化
  presentation_coaching:
    category: general
    description: 演讲技巧，台风训练，互动设计，Q&A应对
    methodology: PREP框架 — Point（观点）→ Reason（原因）→ Example（例子）→ Point（重申）
    name: 演讲辅导
    practices:
    - 开场设计：问题/故事/数据/引用，前30秒抓住注意力
    - 肢体语言：站姿稳定、手势自然、眼神交流全场
    - 语速控制：正常150字/分钟，重点放慢，过渡加快
    - 互动设计：每5-8分钟一个互动点（提问/投票/练习）
    - Q&A准备：预判10个可能问题，准备简洁有力的回答
    - 结尾设计：总结要点+行动号召+有力结束语
    required_tools:
    - read_file
    - write_file
    workflow:
      1: 了解演讲主题和受众
      2: 设计演讲结构和故事线
      3: 编写演讲稿和备注
      4: 设计互动和Q&A环节
      5: 排练和反馈
      6: 最终优化
  progress_tracking:
    category: general
    description: 项目状态跟踪，阻塞识别，进度报告，资源协调
    methodology: 看板方法 — 可视化工作流，限制在制品数量（WIP Limit）
    name: 进度跟踪
    practices:
    - 每日站会：昨天完成/今天计划/阻塞项，不超过15分钟
    - 看板列：待办→进行中→审查→完成，WIP限制每列3-5项
    - 阻塞项必须在24小时内升级或解决
    - 进度报告：完成百分比+风险+下一步，简洁明了
    - 燃尽图：实际进度vs计划进度，提前发现偏差
    - 里程碑检查：每个里程碑有明确的交付物和验收标准
    required_tools:
    - read_file
    - write_file
    workflow:
      1: 更新任务状态（开始/进行中/完成/阻塞）
      2: 识别阻塞项并协调解决
      3: 跟踪关键路径任务进度
      4: 生成进度报告（完成率/风险/下一步）
      5: 调整资源分配和优先级
  risk_management:
    category: general
    description: 风险识别，影响评估，缓解方案，应急预案
    methodology: 风险矩阵 — 概率×影响评估，制定针对性缓解策略
    name: 风险管理
    practices:
    - 风险分类：技术风险/人员风险/进度风险/外部依赖风险
    - 风险评估：概率（低/中/高）× 影响（低/中/高）= 风险等级
    - 每个高风险项必须有缓解方案和应急预案
    - 风险登记册：定期更新，每周review
    - 预警机制：风险触发条件明确，提前预警而非事后补救
    - 技术债管理：记录技术债，安排专项还债迭代
    required_tools:
    - read_file
    workflow:
      1: 头脑风暴识别所有潜在风险
      2: 评估每个风险的概率和影响
      3: 制定缓解方案（降低概率）和应急预案（降低影响）
      4: 分配风险负责人
      5: 定期review风险状态
  sales_enablement:
    category: sales
    description: 销售材料，演示脚本，提案模板，知识库
    methodology: 买家旅程对齐 — 销售材料匹配买家的认知阶段
    name: 销售赋能
    practices:
    - 销售材料分层：认知阶段（白皮书）→ 考虑阶段（案例）→ 决策阶段（ROI）
    - 演示脚本：开场→痛点共鸣→方案展示→价值证明→行动号召
    - 提案模板：执行摘要→需求理解→方案→报价→时间表→团队
    - 异议处理库：常见异议的标准应对话术
    - 客户案例：STAR结构（Situation/Task/Action/Result）
    - 销售工具箱：所有材料集中管理，版本统一
    required_tools:
    - write_file
    - create_slide
    - create_document
    workflow:
      1: 分析销售流程和材料缺口
      2: 创建核心销售材料
      3: 设计演示和提案模板
      4: 编写客户案例和成功故事
      5: 建立异议处理知识库
      6: 定期更新和优化材料
  sales_qualification:
    category: sales
    description: MEDDPICC/BANT资质评估，机会评分，管线管理
    methodology: MEDDPICC框架 — Metrics/Economic Buyer/Decision Criteria/Decision Process/Paper
      Process/Identify Pain/Champion/Competition
    name: 销售资质
    practices:
    - BANT快速筛选：Budget（预算）/Authority（决策权）/Need（需求）/Timeline（时间线）
    - MEDDPICC深度评估：8个维度逐一打分（0-3分）
    - 机会评分：综合评分 < 50% 不进入下一阶段
    - 管线健康度：每个阶段都有足够的机会储备
    - 退出机制：不符合条件的机会及时退出，不浪费资源
    - 复盘机制：赢单/输单都要复盘，提炼经验
    required_tools:
    - read_file
    - write_file
    - create_document
    workflow:
      1: 收集潜在客户信息
      2: BANT快速筛选
      3: MEDDPICC深度评估
      4: 机会评分和优先级排序
      5: 制定跟进策略
      6: 定期复盘和优化
  script_writing:
    category: content
    description: 故事结构设计，角色塑造，对白创作，分镜脚本
    methodology: 三幕结构 — 设置（25%）→ 对抗（50%）→ 解决（25%）
    name: 剧本创作
    practices:
    - 故事钩子：前30秒必须抓住观众注意力
    - 角色动机：每个角色有清晰的目标和障碍
    - 对白原则：推进剧情或揭示角色，删除无意义对话
    - 节奏控制：紧张与舒缓交替，每3-5分钟一个小高潮
    - 分镜描述：每个镜头包含景别/角度/运动/时长
    - AI工具配合：用AI生成初稿，人工打磨细节
    required_tools:
    - write_file
    - edit_file
    workflow:
      1: 确定故事主题和目标受众
      2: 设计故事大纲和三幕结构
      3: 创建角色档案和关系图
      4: 编写分场景剧本
      5: 设计分镜脚本（含镜头描述）
      6: 修订和完善对白
  security_audit:
    category: testing
    description: 安全漏洞扫描，OWASP Top 10检查，安全编码规范
    methodology: 防御纵深 — 多层防御，不依赖单一安全措施
    name: 安全审计
    practices:
    - 输入验证：所有外部输入都是不可信的，白名单验证优于黑名单
    - 输出编码：HTML/URL/JS上下文使用对应编码函数
    - 认证：密码bcrypt/scrypt哈希，JWT设置过期时间，敏感操作二次验证
    - 授权：最小权限原则，RBAC/ABAC，接口级别权限校验
    - 敏感数据：日志/错误信息不泄露内部细节，密钥不硬编码
    - 依赖安全：定期扫描依赖漏洞（npm audit / pip audit）
    required_tools:
    - read_file
    - grep_content
    - run_linter
    workflow:
      1: 识别攻击面：用户输入点、API接口、文件上传、认证入口
      2: 检查OWASP Top 10漏洞（注入/XSS/CSRF/SSRF等）
      3: 审查认证和授权实现
      4: 检查敏感数据处理（存储/传输/日志）
      5: 扫描依赖漏洞
      6: 输出安全报告和修复建议
  sound_design:
    category: ai
    description: 配乐创作，音效设计，音频混合，声音处理
    methodology: 声音层次模型 — 对白层+音效层+环境层+音乐层
    name: 音效设计
    practices:
    - 对白处理：降噪→均衡→压缩→限幅，确保清晰度
    - 音效设计： Foley音效+环境音+特殊音效，增强沉浸感
    - 配乐选择：匹配情绪和节奏，注意版权
    - 音频混合：动态范围控制，-14 LUFS响度标准
    - 空间音频：立体声/环绕声定位
    - 格式输出：48kHz/24bit专业标准
    required_tools:
    - edit_media
    - write_file
    workflow:
      1: 分析视频内容和情感需求
      2: 设计声音方案（对白/音效/音乐）
      3: 采集和制作音频素材
      4: 音频编辑和处理
      5: 多轨混合和平衡
      6: 最终输出和质量检查
  task_decomposition:
    category: general
    description: 需求分析，任务拆解，依赖识别，工时估算
    methodology: INVEST原则 — Independent（独立）、Negotiable（可协商）、Valuable（有价值）、Estimable（可估算）、Small（小）、Testable（可测试）
    name: 任务分解
    practices:
    - 垂直切片：每个任务包含UI→API→DB的完整实现
    - 任务粒度：单个任务不超过2天，超过则继续拆分
    - 依赖识别：标注任务间依赖关系，识别关键路径
    - 验收标准：每个任务有明确的完成定义（Definition of Done）
    - 风险标注：高风险任务提前标记，制定缓解方案
    - 工时估算：使用三点估算法（乐观/最可能/悲观）
    required_tools:
    - read_file
    workflow:
      1: 理解需求全貌，识别核心目标
      2: 将需求分解为功能模块
      3: 将模块分解为可执行任务
      4: 识别任务依赖和关键路径
      5: 估算工时并标注风险
      6: 排定优先级和迭代计划
  testing:
    category: testing
    description: 测试驱动开发，单元/集成/E2E测试，测试策略
    methodology: 测试金字塔 — 大量单元测试（70%）+ 适量集成测试（20%）+ 少量E2E测试（10%）
    name: 测试
    practices:
    - TDD节奏：Red（写失败测试）→ Green（最小实现）→ Refactor（重构）
    - 测试命名：should_期望行为_when_前置条件
    - 每个测试只验证一个行为，AAA模式（Arrange-Act-Assert）
    - Mock外部依赖（数据库/API/文件系统），不Mock被测单元内部
    - 边界条件必测：空值、零值、最大值、负数、并发
    - 测试必须独立可重复，不依赖执行顺序或外部状态
    required_tools:
    - write_file
    - bash
    - run_tests
    workflow:
      1: 分析需求，识别测试场景（正常/异常/边界）
      2: 编写失败的测试用例（Red）
      3: 编写最小实现让测试通过（Green）
      4: 重构代码保持测试通过（Refactor）
      5: 检查覆盖率，补充遗漏的测试场景
  usability_testing:
    category: ux
    description: 测试设计，任务场景，观察分析，改进建议
    methodology: 任务导向测试 — 用户执行真实任务，观察其行为和困难
    name: 可用性测试
    practices:
    - 测试人数：5人发现85%可用性问题
    - 任务设计：基于真实用户场景，避免提示性描述
    - 发声思考法：用户边操作边说出想法
    - 观察记录：任务完成率/时间/错误率/满意度
    - 问题分级：严重（阻塞任务）→ 中等（困难但可完成）→ 轻微（不便）
    - 改进建议：具体、可执行、优先级排序
    required_tools:
    - read_file
    - write_file
    - create_chart
    workflow:
      1: 确定测试目标和范围
      2: 设计测试任务和场景
      3: 招募测试参与者
      4: 执行测试并观察记录
      5: 分析数据并识别问题
      6: 编写报告和改进建议
  user_research:
    category: ux
    description: 用户访谈，行为分析，需求洞察，研究方法论
    methodology: 混合方法研究 — 定性（深度访谈）+ 定量（数据分析）交叉验证
    name: 用户研究
    practices:
    - 用户访谈：5人发现85%问题，半结构化访谈指南
    - 观察法：用户在自然环境中使用产品，记录行为而非意见
    - 问卷设计：避免引导性问题，控制在10分钟内
    - 数据分析三角验证：行为数据+访谈数据+问卷数据
    - 用户旅程图：识别痛点和机会点
    - 研究发现可操作化：每个发现对应具体改进建议
    required_tools:
    - read_file
    - write_file
    - create_document
    - create_chart
    workflow:
      1: 定义研究目标和问题
      2: 选择研究方法和招募参与者
      3: 设计研究工具（访谈指南/问卷/任务脚本）
      4: 执行研究并收集数据
      5: 分析数据并提取洞察
      6: 编写研究报告和建议
  video_editing:
    category: ai
    description: 剪辑节奏，调色处理，特效合成，音频混合
    methodology: 节奏驱动剪辑 — 剪辑点跟随音乐节拍和内容节奏
    name: 视频剪辑
    practices:
    - 粗剪→精剪→调色→音频→特效，分阶段处理
    - J-cut和L-cut：音频先于/后于画面切换，增加流畅感
    - 调色三步：校正（白平衡/曝光）→ 风格化（LUT/色温）→ 局部调整
    - 音频层次：对白>音效>音乐，对白清晰度优先
    - 字幕规范：字体/大小/位置/颜色统一
    - 导出设置：分辨率/码率/编码格式匹配发布平台
    required_tools:
    - edit_media
    - bash
    workflow:
      1: 导入素材并整理归类
      2: 粗剪：按故事线排列素材
      3: 精剪：调整节奏和转场
      4: 调色和画面处理
      5: 音频混合和字幕添加
      6: 导出和质量检查
  video_generation:
    category: ai
    description: AI视频生成，动态控制，视频合成，风格迁移
    methodology: 镜头语言 — 景别/运动/节奏/转场的系统化控制
    name: 视频生成
    practices:
    - 镜头设计：远景建立场景→中景展示动作→近景表达情感
    - 运动控制：推/拉/摇/移/跟，运动速度和缓动曲线
    - 一致性：角色外观/场景风格/色调保持统一
    - 时长控制：短视频15-60秒，宣传片1-3分钟
    - 转场设计：硬切/溶解/运动转场，匹配内容节奏
    - AI+人工：AI生成素材，人工剪辑组合
    required_tools:
    - generate_video
    - edit_media
    workflow:
      1: 设计分镜脚本和镜头列表
      2: 生成各镜头的AI视频素材
      3: 筛选和调整素材
      4: 剪辑组合和转场处理
      5: 添加音频和字幕
      6: 导出和格式转换
