services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    ports:
      - "8765:8765"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - BACKEND_TOKEN=${BACKEND_TOKEN:-}
    env_file:
      - .env

  executor:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    command: python executor_server.py
    ports:
      - "8767:8767"
    volumes:
      - executor-workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8767/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1
      - EXECUTOR_WORKSPACE=/workspace
      - EXECUTOR_STORAGE=local
      - EXECUTOR_TOKEN=${EXECUTOR_TOKEN:-}

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ./dist:/dist
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - EXECUTOR_TOKEN=${EXECUTOR_TOKEN:-}
      - EXECUTOR_URL=http://executor:8767
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  executor-workspace:
