<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050508;
    --bg-surface: #0c0c14;
    --bg-elevated: #141420;
    --bg-input: #0a0a12;
    --border-dim: #1e1e32;
    --border-glow: #1a2a3a;
    --cyan: #00e5ff;
    --cyan-dim: rgba(0, 229, 255, 0.12);
    --cyan-glow: rgba(0, 229, 255, 0.25);
    --pink: #ff2d78;
    --pink-dim: rgba(255, 45, 120, 0.1);
    --amber: #ffb74d;
    --amber-dim: rgba(255, 183, 77, 0.1);
    --green: #00e676;
    --green-dim: rgba(0, 230, 118, 0.1);
    --red: #ff1744;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a0;
    --text-muted: #4a4a60;
    --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg-deep);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0, 229, 255, 0.03) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(255, 45, 120, 0.02) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.015) 2px,
      rgba(0, 0, 0, 0.015) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  .header {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border-dim);
    background: rgba(12, 12, 20, 0.8);
    backdrop-filter: blur(12px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .agent-dot {
    position: relative;
    width: 10px;
    height: 10px;
  }
  .agent-dot::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0.3;
    animation: dot-pulse 2s ease-in-out infinite;
  }
  .agent-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan-glow);
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(2.2); opacity: 0; }
  }

  .header-title {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-primary);
  }
  .header-title span { color: var(--cyan); }

  .header-badge {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid var(--border-dim);
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .header-badge.online {
    border-color: rgba(0, 230, 118, 0.3);
    color: var(--green);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-page {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    color: var(--text-muted);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Status Bar ── */
  .status-bar {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 18px;
    border-bottom: 1px solid var(--border-dim);
    background: var(--bg-surface);
  }
  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 0.55rem;
    color: var(--text-muted);
  }
  .status-val {
    color: var(--text-secondary);
  }
  .status-val.active { color: var(--cyan); }

  /* ── Chat Area ── */
  .chat-area {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar {
    width: 4px;
  }
  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }
  .chat-area::-webkit-scrollbar-thumb {
    background: var(--border-dim);
    border-radius: 2px;
  }

  /* ── Welcome Screen ── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 20px;
    text-align: center;
  }

  .welcome-ring {
    position: relative;
    width: 72px;
    height: 72px;
    margin-bottom: 4px;
  }
  .welcome-ring::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    background:
      linear-gradient(var(--bg-deep), var(--bg-deep)) padding-box,
      conic-gradient(from 0deg, var(--cyan), var(--pink), var(--amber), var(--cyan)) border-box;
    animation: ring-spin 6s linear infinite;
    opacity: 0.5;
  }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  .welcome-ring-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-dim);
  }
  .welcome-ring-inner svg { width: 32px; height: 32px; opacity: 0.6; }

  .welcome-title {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-primary);
  }
  .welcome-sub {
    font-size: 0.72rem;
    color: var(--text-secondary);
    max-width: 320px;
    line-height: 1.5;
  }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }
  .quick-chip {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    padding: 6px 12px;
    border-radius: 16px;
    border: 1px solid var(--border-dim);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-chip:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
    box-shadow: 0 0 12px var(--cyan-glow);
  }

  /* ── Message Bubbles ── */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 92%;
    animation: msg-in 0.3s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    margin-top: 2px;
  }
  .msg.agent .msg-avatar {
    background: var(--bg-elevated);
    border: 1px solid var(--border-dim);
    color: var(--cyan);
  }
  .msg.user .msg-avatar {
    background: var(--pink-dim);
    border: 1px solid rgba(255, 45, 120, 0.25);
    color: var(--pink);
  }

  .msg-bubble {
    position: relative;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.72rem;
    line-height: 1.55;
    word-break: break-word;
  }

  .msg.agent .msg-bubble {
    background: var(--bg-elevated);
    border: 1px solid var(--border-dim);
    border-top-left-radius: 4px;
    color: var(--text-primary);
  }

  .msg.user .msg-bubble {
    background: linear-gradient(135deg, rgba(255, 45, 120, 0.15), rgba(255, 45, 120, 0.06));
    border: 1px solid rgba(255, 45, 120, 0.2);
    border-top-right-radius: 4px;
    color: var(--text-primary);
  }

  .msg-time {
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .msg.user .msg-time { text-align: right; }

  /* ── Agent thinking ── */
  .msg.agent.thinking .msg-bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
    min-height: 36px;
  }
  .think-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    animation: think-bounce 1.2s ease-in-out infinite;
  }
  .think-dot:nth-child(2) { animation-delay: 0.2s; }
  .think-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes think-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Tool execution card ── */
  .tool-card {
    margin: 4px 0;
    font-family: var(--font-mono);
    font-size: 0.58rem;
    border-radius: 6px;
    border: 1px solid var(--amber-dim);
    background: rgba(255, 183, 77, 0.04);
    overflow: hidden;
    animation: tool-slide 0.3s ease-out;
  }
  @keyframes tool-slide {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .tool-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid rgba(255, 183, 77, 0.08);
    color: var(--amber);
  }
  .tool-icon {
    width: 14px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-label {
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.5rem;
  }
  .tool-cmd {
    color: var(--text-secondary);
    margin-left: auto;
  }
  .tool-card-body {
    padding: 6px 10px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 80px;
    overflow-y: auto;
  }
  .tool-card-body::-webkit-scrollbar { width: 3px; }
  .tool-card-body::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 1px; }

  .tool-card.done {
    border-color: rgba(0, 230, 118, 0.2);
    background: rgba(0, 230, 118, 0.03);
  }
  .tool-card.done .tool-card-header { color: var(--green); border-bottom-color: rgba(0, 230, 118, 0.08); }
  .tool-card.error {
    border-color: rgba(255, 23, 68, 0.2);
    background: rgba(255, 23, 68, 0.03);
  }
  .tool-card.error .tool-card-header { color: var(--red); border-bottom-color: rgba(255, 23, 68, 0.08); }

  /* ── Code block in messages ── */
  .msg-bubble pre {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border-dim);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 8px 0;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    overflow-x: auto;
    color: var(--cyan);
    position: relative;
  }
  .msg-bubble pre::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan-glow), transparent);
    opacity: 0.4;
  }
  .msg-bubble code {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    background: rgba(0, 229, 255, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--cyan);
  }
  .msg-bubble pre code {
    background: none;
    padding: 0;
    color: inherit;
  }

  .msg-bubble .inline-result {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.58rem;
  }
  .inline-result.ok {
    background: var(--green-dim);
    color: var(--green);
  }
  .inline-result.err {
    background: rgba(255, 23, 68, 0.1);
    color: var(--red);
  }

  /* ── Input Area ── */
  .input-area {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--border-dim);
    background: rgba(12, 12, 20, 0.85);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-input);
    border: 1px solid var(--border-dim);
    border-radius: 12px;
    padding: 6px 6px 6px 14px;
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: rgba(0, 229, 255, 0.35);
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.06);
  }

  .chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 0.72rem;
    line-height: 1.5;
    resize: none;
    max-height: 100px;
    padding: 6px 0;
  }
  .chat-input::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-dim);
    background: var(--bg-elevated);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .send-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
    box-shadow: 0 0 12px var(--cyan-glow);
  }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 16px; height: 16px; }

  .input-hint {
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .input-hint kbd {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border-dim);
    background: var(--bg-elevated);
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--text-secondary);
  }

  .settings-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border-dim);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .settings-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }
  .settings-btn svg { width: 14px; height: 14px; }

  .settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .settings-panel {
    width: 420px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border-dim);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .settings-panel::-webkit-scrollbar {
    width: 4px;
  }
  .settings-panel::-webkit-scrollbar-thumb {
    background: var(--border-dim);
    border-radius: 2px;
  }

  .settings-panel h3 {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-primary);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-panel h3 span { color: var(--cyan); }

  .settings-group {
    margin-bottom: 16px;
  }
  .settings-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.55rem;
    letter-spacing: 0.8px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .settings-input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-dim);
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.65rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .settings-input:focus {
    border-color: rgba(0, 229, 255, 0.35);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.05);
  }
  .settings-input::placeholder { color: var(--text-muted); }

  .settings-textarea {
    width: 100%;
    min-height: 120px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-dim);
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .settings-textarea:focus {
    border-color: rgba(0, 229, 255, 0.35);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.05);
  }
  .settings-textarea::placeholder { color: var(--text-muted); }

  .settings-hint {
    font-family: var(--font-mono);
    font-size: 0.5rem;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }

  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .settings-btn-primary {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--cyan);
    background: var(--cyan-dim);
    color: var(--cyan);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .settings-btn-primary:hover {
    background: rgba(0, 229, 255, 0.2);
    box-shadow: 0 0 16px var(--cyan-glow);
  }
  .settings-btn-secondary {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border-dim);
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .settings-btn-secondary:hover {
    border-color: var(--text-secondary);
  }

  .settings-btn-reset {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid rgba(255, 45, 120, 0.2);
    background: transparent;
    color: var(--pink);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: auto;
  }
  .settings-btn-reset:hover {
    background: var(--pink-dim);
    border-color: rgba(255, 45, 120, 0.4);
  }

  .settings-divider {
    border: none;
    border-top: 1px solid var(--border-dim);
    margin: 18px 0;
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="agent-dot"></div>
    <div class="header-title">AI <span>Agent</span></div>
  </div>
  <div class="header-right">
    <button class="settings-btn" id="settingsBtn" title="API 配置">
      <svg viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1"/>
        <path d="M7 1.5 L7.8 3.2 L7 4.5 L6.2 3.2 Z" stroke="currentColor" stroke-width="0.8" fill="none"/>
        <path d="M12.5 7 L11 7.5 L10.2 6.5 L11 5.5 Z" stroke="currentColor" stroke-width="0.8" fill="none"/>
        <path d="M1.5 7 L3 7.5 L3.8 6.5 L3 5.5 Z" stroke="currentColor" stroke-width="0.8" fill="none"/>
        <path d="M7 12.5 L7.8 10.8 L6.2 9.5 L5.5 10.3 Z" stroke="currentColor" stroke-width="0.8" fill="none"/>
      </svg>
    </button>
    <span class="header-page" id="headerPage">—</span>
    <span class="header-badge online" id="headerBadge">ONLINE</span>
  </div>
</header>

<!-- Status -->
<div class="status-bar">
  <div class="status-item">会话<span class="status-val" id="statusSessions">1</span></div>
  <div class="status-item">标签页<span class="status-val active" id="statusTabs">—</span></div>
  <div class="status-item">协议<span class="status-val" id="statusProto">v1.1</span></div>
</div>

<!-- Chat -->
<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcomeScreen">
    <div class="welcome-ring">
      <div class="welcome-ring-inner">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="12" r="6" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          <ellipse cx="14" cy="11" rx="1.2" ry="1.5" fill="currentColor" opacity="0.5"/>
          <ellipse cx="18" cy="11" rx="1.2" ry="1.5" fill="currentColor" opacity="0.5"/>
          <path d="M13 15.5 Q16 18, 19 15.5" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.5"/>
          <path d="M16 19 L16 23 M14 21 L16 23 L18 21" stroke="currentColor" stroke-width="0.6" fill="none" opacity="0.4"/>
          <rect x="10" y="22" width="12" height="5" rx="2" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
        </svg>
      </div>
    </div>
    <div class="welcome-title">AI AUTOMATION AGENT</div>
    <div class="welcome-sub">
      我可以帮你操控浏览器——导航页面、点击元素、填写表单、执行计划。试试下面的快捷指令，或者直接告诉我你想做什么。
    </div>
    <div class="quick-chips">
      <button class="quick-chip" data-cmd="打开 github.com">🌐 打开 github.com</button>
      <button class="quick-chip" data-cmd="搜索 chromium browser">🔍 搜索 chromium browser</button>
      <button class="quick-chip" data-cmd="截取当前页面截图">📸 截取页面截图</button>
      <button class="quick-chip" data-cmd="列出所有标签页">📑 列出所有标签页</button>
      <button class="quick-chip" data-cmd="向下滚动 500 像素">⬇ 向下滚动</button>
      <button class="quick-chip" data-cmd="等待 2 秒">⏱ 等待 2 秒</button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrapper">
    <textarea
      class="chat-input"
      id="chatInput"
      rows="1"
      placeholder="输入指令，例如：打开 github.com 并搜索 react..."
    ></textarea>
    <button class="send-btn" id="sendBtn" title="发送 (Enter)">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M2 2 L14 8 L2 14 L4 8 L2 2Z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">
    <kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel" id="settingsPanel">
    <h3><span>⚙</span> API 配置</h3>

    <div class="settings-group">
      <label class="settings-label">BASE URL</label>
      <input class="settings-input" type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com">
      <div class="settings-hint">DeepSeek API 地址，默认使用官方地址</div>
    </div>

    <div class="settings-group">
      <label class="settings-label">API KEY</label>
      <input class="settings-input" type="password" id="cfgApiKey" placeholder="sk-...">
      <div class="settings-hint">您的 DeepSeek API Key</div>
    </div>

    <hr class="settings-divider">

    <h3><span>📝</span> System Prompt</h3>
    <div class="settings-group">
      <label class="settings-label">系统提示词</label>
      <textarea class="settings-textarea" id="cfgPrompt" placeholder="输入系统提示词..."></textarea>
      <div class="settings-hint">用于设定助手行为和上下文。可用 <code>{user_message}</code> 作为用户输入的占位符。命令解析由 Tool Calling 自动完成，无需在 Prompt 中约束格式。</div>
    </div>

    <div class="settings-actions">
      <button class="settings-btn-reset" id="settingsReset">恢复默认</button>
      <button class="settings-btn-secondary" id="settingsCancel">取消</button>
      <button class="settings-btn-primary" id="settingsSave">保存</button>
    </div>
  </div>
</div>

<script type="module" src="dist/company-app.js"></script>
</body>
</html>
