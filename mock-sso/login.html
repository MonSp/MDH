<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟 SSO 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #666;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .status-message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .status-message.loading {
      background: #cce5ff;
      color: #004085;
      display: block;
    }
    .debug-info {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
    }
    .debug-info h3 {
      margin-bottom: 8px;
      color: #333;
    }
    .debug-info pre {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    .checkbox-group label {
      margin: 0;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>模拟 SSO 登录</h1>
      <p>用于测试 iframe 握手断裂问题</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" value="testuser">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" value="testpass">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="simulateDelay" checked>
        <label for="simulateDelay">模拟网络延迟 (2秒)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="simulateRedirect" checked>
        <label for="simulateRedirect">登录后重定向回原页面</label>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>

    <div class="status-message" id="statusMessage"></div>

    <div class="debug-info">
      <h3>调试信息</h3>
      <div id="debugContent">等待登录...</div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const statusMessage = document.getElementById('statusMessage');
    const debugContent = document.getElementById('debugContent');
    const simulateDelay = document.getElementById('simulateDelay');
    const simulateRedirect = document.getElementById('simulateRedirect');

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = `[${timestamp}] ${message}`;
      console.log(logEntry);
      debugContent.innerHTML = logEntry + '\n' + debugContent.innerHTML;
    }

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = 'status-message ' + type;
    }

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        redirect: params.get('redirect') || '',
        origin: params.get('origin') || '',
        state: params.get('state') || '',
      };
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showStatus('请输入用户名和密码', 'error');
        return;
      }

      loginBtn.disabled = true;
      showStatus('正在登录...', 'loading');
      log(`开始登录: 用户名=${username}`);

      try {
        if (simulateDelay.checked) {
          log('模拟网络延迟 (2秒)...');
          await new Promise(resolve => setTimeout(resolve, 2000));
        }

        log('验证凭据...');
        await new Promise(resolve => setTimeout(resolve, 500));

        const token = 'mock_token_' + Date.now();
        log(`登录成功: token=${token.substring(0, 20)}...`);

        showStatus('登录成功！正在重定向...', 'success');

        const params = getUrlParams();
        log(`重定向参数: redirect=${params.redirect}, origin=${params.origin}`);

        if (simulateRedirect.checked && params.redirect) {
          log(`准备重定向到: ${params.redirect}`);
          setTimeout(() => {
            const separator = params.redirect.includes('?') ? '&' : '?';
            const redirectUrl = `${params.redirect}${separator}token=${token}&username=${username}`;
            log(`执行重定向: ${redirectUrl}`);
            window.location.href = redirectUrl;
          }, 1000);
        } else if (simulateRedirect.checked) {
          log('无重定向 URL，尝试通知父窗口');
          if (window.opener) {
            window.opener.postMessage({
              type: 'sso_login_success',
              token: token,
              username: username,
            }, params.origin || '*');
            log('已通知父窗口，准备关闭窗口');
            setTimeout(() => window.close(), 1000);
          }
        }

      } catch (error) {
        log(`登录失败: ${error.message}`);
        showStatus('登录失败: ' + error.message, 'error');
      } finally {
        loginBtn.disabled = false;
      }
    });

    log('模拟 SSO 登录页面已加载');
    log(`当前 URL: ${window.location.href}`);
    log(`Origin: ${window.location.origin}`);

    const params = getUrlParams();
    if (params.redirect) {
      log(`检测到重定向参数: ${params.redirect}`);
    }
  </script>
</body>
</html>
