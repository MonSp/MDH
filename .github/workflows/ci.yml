name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ --timeout=60 --ignore=tests/legacy

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - name: Run frontend tests
        run: npx vitest run

  judge-benchmark-gate:
    name: LLM judge benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run benchmark gate
        run: python backend/asset_benchmark_gate.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # 无 key 时（未配置 secret）跑确定性 perfect-judge 自检（恒过，注明未跑真实评测）；
        # 配置 DEEPSEEK_API_KEY secret 后启用真实 judge 评测门禁。

  task-benchmark-gate:
    name: Task benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run benchmark gate (self-check)
        working-directory: backend
        run: python benchmark_gate.py
      - name: Run benchmark with baseline
        working-directory: backend
        run: python benchmark_cli.py --baseline ../baselines/v2.1.0.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build backend image
        run: docker build -t mdh-backend:ci -f backend/Dockerfile.backend .
      - name: Build frontend image
        run: docker build -t mdh-frontend:ci -f Dockerfile.frontend .
      - name: Verify backend health
        run: |
          docker run -d --name backend-test -p 8765:8765 mdh-backend:ci
          sleep 5
          curl -f http://localhost:8765/health || exit 1
          docker stop backend-test
