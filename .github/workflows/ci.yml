name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov pytest-rerunfailures
      - name: Run backend tests with coverage
        working-directory: backend
        run: python -m pytest tests/ --timeout=60 --ignore=tests/legacy --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=75

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        working-directory: backend
        run: ruff check . --select=E,F,W --ignore=E501,E402,F841,E701,E702,E712,E731,E741 --exclude=tests/legacy
      - name: Run ruff format check
        working-directory: backend
        run: ruff format --check . || true

  backend-security:
    name: Backend security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt --desc --progress-spinner off || true

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - name: Run frontend tests with coverage
        run: npx vitest run --coverage || npx vitest run

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
      - name: Run eslint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings=100 || true

  orchestrator-tests:
    name: Orchestrator tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        working-directory: orchestrator
        run: npm install --no-audit --no-fund
      - name: Run orchestrator tests
        working-directory: orchestrator
        run: npx vitest run

  judge-benchmark-gate:
    name: LLM judge benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run benchmark gate
        run: python backend/asset_benchmark_gate.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  task-benchmark-gate:
    name: Task benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run benchmark gate (self-check)
        working-directory: backend
        run: python benchmark_gate.py
      - name: Run benchmark with baseline
        working-directory: backend
        run: python benchmark_cli.py --baseline ../baselines/v2.1.0.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, orchestrator-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build backend image
        run: docker build -t mdh-backend:ci -f backend/Dockerfile.backend .
      - name: Build frontend image
        run: docker build -t mdh-frontend:ci -f Dockerfile.frontend .
      - name: Verify backend health
        run: |
          docker run -d --name backend-test -p 8765:8765 mdh-backend:ci
          sleep 5
          curl -f http://localhost:8765/health || exit 1
          docker stop backend-test
