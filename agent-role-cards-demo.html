<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 角色卡片效果展示</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeInDown 0.8s ease;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .header p {
      font-size: 18px;
      color: #a0a0b0;
      max-width: 600px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease 0.2s both;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .stat-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .stat-label {
      font-size: 14px;
      color: #808090;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    .agent-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease both;
    }

    .agent-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .agent-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .agent-card:hover::before {
      opacity: 1;
    }

    .agent-card.expanded {
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .role-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.3s ease;
    }

    .agent-card:hover .role-avatar {
      transform: scale(1.1) rotate(5deg);
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid var(--status-color);
      animation: rotate 3s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .agent-info {
      flex: 1;
    }

    .agent-name {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--gradient);
      border-radius: 20px;
      font-size: 12px;
      color: white;
      font-weight: 500;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f5f5f7;
      border-radius: 20px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--status-color);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }

    .motto-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .motto-icon {
      font-size: 20px;
    }

    .motto-text {
      font-size: 14px;
      color: #555;
      font-style: italic;
    }

    .task-indicator {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      background: #f8f9fa;
      border-radius: 14px;
      border: 1px solid #e9ecef;
      margin-bottom: 20px;
    }

    .task-indicator.active {
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
      border-color: var(--theme-color);
    }

    .task-icon {
      font-size: 28px;
    }

    .task-indicator.active .task-icon {
      animation: spin 2s linear infinite;
    }

    .task-info {
      flex: 1;
    }

    .task-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    .task-id {
      font-size: 14px;
      font-family: 'Courier New', monospace;
      color: #333;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: var(--gradient);
      border-radius: 3px;
      animation: progress-flow 2s ease-in-out infinite;
    }

    @keyframes progress-flow {
      0% { width: 20%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 20%; margin-left: 80%; }
    }

    .expanded-content {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      animation: fadeIn 0.3s ease;
    }

    .description-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .description-text {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
    }

    .specializations {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .spec-tag {
      padding: 6px 14px;
      background: var(--gradient);
      color: white;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .cap-tag {
      padding: 6px 14px;
      background: var(--bg-light);
      color: var(--theme-color);
      border: 1px solid var(--theme-color);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      transition: transform 0.2s ease;
    }

    .cap-tag:hover {
      transform: scale(1.05);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric-card {
      text-align: center;
      padding: 14px;
      background: #f8f9fa;
      border-radius: 12px;
    }

    .metric-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .metric-value.success { color: #10b981; }
    .metric-value.error { color: #ef4444; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .footer-info {
      font-size: 12px;
      color: #999;
    }

    .expand-btn {
      font-size: 12px;
      color: var(--theme-color);
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      padding: 4px 8px;
    }

    .expand-btn:hover {
      text-decoration: underline;
    }

    .error-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      margin-top: 16px;
    }

    .error-icon { font-size: 20px; }
    .error-msg { font-size: 13px; color: #dc2626; }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .filter-btn {
      padding: 10px 20px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #a0a0b0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .filter-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }

    .filter-btn.active {
      border-color: var(--btn-color);
      background: var(--btn-color);
      color: white;
    }

    .instructions {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.8s ease 0.6s both;
    }

    .instructions h2 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 20px;
    }

    .instructions ul {
      list-style: none;
    }

    .instructions li {
      font-size: 15px;
      color: #a0a0b0;
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
    }

    .instructions li::before {
      content: '✨';
      position: absolute;
      left: 0;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      
      .stats-bar {
        flex-direction: column;
        align-items: center;
      }
      
      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Agent 角色卡片展示</h1>
      <p>探索多Agent协作系统中各个智能体的角色形象、个性特征和实时工作状态</p>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="filter-bar" id="filterBar"></div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="instructions">
      <h2>🎮 交互说明</h2>
      <ul>
        <li>点击任意卡片可展开查看详细的角色信息</li>
        <li>每个Agent都有独特的视觉形象、主题色彩和标志性图标</li>
        <li>忙碌状态的Agent会显示动态旋转的进度指示器</li>
        <li>使用上方的筛选按钮可按状态过滤显示的Agent</li>
        <li>悬停卡片可看到流畅的放大和阴影效果</li>
        <li>错误和离线状态的Agent会有特殊的视觉标识</li>
      </ul>
    </div>
  </div>

    function formatTime(timestamp) {
      const diff = Date.now() - timestamp;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
      return `${Math.floor(diff / 86400000)} 天前`;
    }

    function getStatusCounts() {
      const counts = { all: agents.length };
      agents.forEach(a => {
        counts[a.status] = (counts[a.status] || 0) + 1;
      });
      return counts;
    }

    function renderStats() {
      const counts = getStatusCounts();
      const stats = [
        { label: '总计', value: counts.all, color: '#8b5cf6' },
        { label: '空闲', value: counts.idle || 0, color: '#10b981' },
        { label: '忙碌', value: counts.busy || 0, color: '#f59e0b' },
        { label: '等待', value: counts.waiting || 0, color: '#3b82f6' },
        { label: '错误', value: counts.error || 0, color: '#ef4444' },
        { label: '离线', value: counts.offline || 0, color: '#6b7280' },
      ];

      document.getElementById('statsBar').innerHTML = stats.map(s => `
        <div class="stat-item">
          <div class="stat-dot" style="background: ${s.color}"></div>
          <div>
            <div class="stat-label">${s.label}</div>
            <div class="stat-value">${s.value}</div>
          </div>
        </div>
      `).join('');
    }

    function renderFilters() {
      const counts = getStatusCounts();
      const filters = [
        { key: 'all', label: '全部', color: '#8b5cf6', count: counts.all },
        { key: 'idle', label: '空闲', color: '#10b981', count: counts.idle || 0 },
        { key: 'busy', label: '忙碌', color: '#f59e0b', count: counts.busy || 0 },
        { key: 'waiting', label: '等待中', color: '#3b82f6', count: counts.waiting || 0 },
        { key: 'error', label: '错误', color: '#ef4444', count: counts.error || 0 },
        { key: 'offline', label: '离线', color: '#6b7280', count: counts.offline || 0 },

          class="filter-btn ${filterStatus === f.key ? 'active' : ''}"
          style="--btn-color: ${f.color}"
          onclick="setFilter('${f.key}')"

        </button>
      `).join('');
    }

            class="agent-card ${isExpanded ? 'expanded' : ''}"
            style="
              --gradient: ${agent.gradient};
              --theme-color: ${agent.themeColor};
              --shadow-color: ${agent.shadowColor};
              --bg-light: ${agent.bgLight};
              --bg-lighter: ${agent.bgLighter};
              --status-color: ${agent.statusColor};
              animation-delay: ${i * 0.1}s;

      selectedAgentId = selectedAgentId === id ? null : id;
