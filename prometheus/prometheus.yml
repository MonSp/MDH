global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'mdh-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8765']
  - job_name: 'mdh-orchestrator'
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestrator:9090']
