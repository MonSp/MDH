<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Component Preview — 大荒界 MDH Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    .preview-title {
      color: var(--color-text-primary);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .preview-subtitle {
      color: var(--color-text-muted);
      font-size: 0.8rem;
      margin-bottom: 40px;
      font-family: var(--font-mono);
    }

    .cards-container {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .variant-label {
      color: var(--color-text-muted);
      font-size: 0.7rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      text-align: center;
    }

    .variant-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Card Component ── */
    .card {
      width: 320px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-default);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      display: flex;
      flex-direction: column;
    }

    .card--elevated {
      box-shadow: var(--settings-panel-shadow);
    }

    .card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border-default);
    }

    .card__title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .card__badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.65rem;
      font-family: var(--font-mono);
      color: var(--color-accent-green);
      background: var(--color-accent-green-dim);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    .card__badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent-green);
    }

    .card__body {
      flex: 1;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .card__body-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .card__body-row + .card__body-row {
      border-top: 1px solid var(--color-border-default);
    }

    .card__body-label {
      color: var(--color-text-muted);
      font-size: 0.75rem;
    }

    .card__body-value {
      color: var(--color-text-primary);
      font-size: 0.8rem;
      font-family: var(--font-mono);
    }

    .card__body-value--role {
      color: var(--color-accent-purple);
    }

    .card__body-value--status {
      color: var(--color-accent-green);
    }

    .card__footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--color-border-default);
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }

    .card__footer-action {
      color: var(--color-accent-blue);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    .card__footer-action:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="dark">

  <div class="preview-title">Card</div>
  <div class="preview-subtitle">glassmorphism dashboard card</div>

  <div class="cards-container">

    <!-- Variant 1: Flat -->
    <div class="variant-wrapper">
      <div class="variant-label">Flat</div>
      <div class="card">
        <div class="card__header">
          <span class="card__title">Agent Status</span>
          <span class="card__badge">Online</span>
        </div>
        <div class="card__body">
          <div class="card__body-row">
            <span class="card__body-label">Agent ID</span>
            <span class="card__body-value">wb-planner-07</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Role</span>
            <span class="card__body-value card__body-value--role">Planner</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Tasks</span>
            <span class="card__body-value">12 / 18</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Status</span>
            <span class="card__body-value card__body-value--status">Active</span>
          </div>
        </div>
        <div class="card__footer">
          <span>Updated 2 min ago</span>
          <span class="card__footer-action">View Details &rarr;</span>
        </div>
      </div>
    </div>

    <!-- Variant 2: Elevated -->
    <div class="variant-wrapper">
      <div class="variant-label">Elevated</div>
      <div class="card card--elevated">
        <div class="card__header">
          <span class="card__title">Agent Status</span>
          <span class="card__badge">Online</span>
        </div>
        <div class="card__body">
          <div class="card__body-row">
            <span class="card__body-label">Agent ID</span>
            <span class="card__body-value">wb-executor-03</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Role</span>
            <span class="card__body-value card__body-value--role">Executor</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Tasks</span>
            <span class="card__body-value">8 / 15</span>
          </div>
          <div class="card__body-row">
            <span class="card__body-label">Status</span>
            <span class="card__body-value card__body-value--status">Active</span>
          </div>
        </div>
        <div class="card__footer">
          <span>Updated 5 min ago</span>
          <span class="card__footer-action">View Details &rarr;</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
