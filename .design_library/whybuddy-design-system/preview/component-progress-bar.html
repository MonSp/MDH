<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bar — 大荒界 MDH Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg-base);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 24px;
    }

    .preview-container {
      max-width: 600px;
      width: 100%;
    }

    .preview-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .preview-subtitle {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-bottom: 40px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .demo-group {
      margin-bottom: 48px;
    }

    /* ── Progress Bar Component ── */

    .progress-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar + .progress-bar {
      margin-top: 20px;
    }

    .progress-track {
      flex: 1;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--color-text-primary);
      min-width: 0;
      white-space: nowrap;
    }

    .progress-percentage {
      font-weight: 600;
      color: var(--color-text-primary);
      min-width: 50px;
      text-align: right;
    }

    /* ── Size Variants ── */

    .progress-bar--sm .progress-track {
      height: 4px;
      border-radius: 2px;
    }

    .progress-bar--md .progress-track {
      height: 8px;
      border-radius: 4px;
    }

    .progress-bar--lg .progress-track {
      height: 12px;
      border-radius: 6px;
    }

    .progress-bar--sm .progress-percentage {
      font-size: 0.8rem;
    }

    .progress-bar--md .progress-percentage {
      font-size: 1rem;
    }

    .progress-bar--lg .progress-percentage {
      font-size: 1.2rem;
    }

    /* ── Color Variants ── */

    .progress-fill--blue { background: var(--color-accent-blue); }
    .progress-fill--green { background: var(--color-accent-green); }
    .progress-fill--amber { background: var(--color-accent-amber); }
    .progress-fill--red { background: var(--color-accent-red); }
    .progress-fill--purple { background: var(--color-accent-purple); }

    /* ── Task Example ── */

    .task-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-sm);
      padding: 20px;
    }

    .task-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .task-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .task-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-accent-blue);
      background: var(--color-accent-blue-dim);
      padding: 2px 8px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="preview-container">

    <h1 class="preview-title">Progress Bar</h1>
    <p class="preview-subtitle">Visual indicator showing completion status of a task or process.</p>

    <!-- Section 1: Size Variants -->
    <div class="demo-group">
      <div class="section-label">Size Variants — 65%</div>

      <div class="progress-bar progress-bar--sm">
        <span class="progress-label">SM</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--blue" style="width: 65%"></div>
        </div>
        <span class="progress-percentage">65%</span>
      </div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">MD</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--blue" style="width: 65%"></div>
        </div>
        <span class="progress-percentage">65%</span>
      </div>

      <div class="progress-bar progress-bar--lg">
        <span class="progress-label">LG</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--blue" style="width: 65%"></div>
        </div>
        <span class="progress-percentage">65%</span>
      </div>
    </div>

    <!-- Section 2: Color Variants -->
    <div class="demo-group">
      <div class="section-label">Color Variants — MD Size</div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">Blue</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--blue" style="width: 30%"></div>
        </div>
        <span class="progress-percentage">30%</span>
      </div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">Green</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--green" style="width: 55%"></div>
        </div>
        <span class="progress-percentage">55%</span>
      </div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">Amber</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--amber" style="width: 75%"></div>
        </div>
        <span class="progress-percentage">75%</span>
      </div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">Red</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--red" style="width: 90%"></div>
        </div>
        <span class="progress-percentage">90%</span>
      </div>

      <div class="progress-bar progress-bar--md">
        <span class="progress-label">Purple</span>
        <div class="progress-track">
          <div class="progress-fill progress-fill--purple" style="width: 45%"></div>
        </div>
        <span class="progress-percentage">45%</span>
      </div>
    </div>

    <!-- Section 3: Task Progress Example -->
    <div class="demo-group">
      <div class="section-label">Task Progress</div>

      <div class="task-card">
        <div class="task-header">
          <span class="task-name">Frontend Development</span>
          <span class="task-status">In Progress</span>
        </div>
        <div class="progress-bar progress-bar--md">
          <div class="progress-track">
            <div class="progress-fill progress-fill--blue" style="width: 78%"></div>
          </div>
          <span class="progress-percentage">78%</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
